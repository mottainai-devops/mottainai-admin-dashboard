name: Deploy Admin Dashboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean previous build artifacts
        run: rm -rf dist/

      - name: Build frontend
        env:
          VITE_APP_TITLE: "Mottainai Admin Dashboard"
          VITE_APP_LOGO: "/favicon.ico"
          VITE_ANALYTICS_ENDPOINT: ""
          VITE_ANALYTICS_WEBSITE_ID: ""
        run: pnpm build

      - name: Verify build title
        run: |
          TITLE=$(grep -o '<title>[^<]*</title>' dist/public/index.html | head -1)
          echo "Built title: $TITLE"
          if [ "$TITLE" != "<title>Mottainai Admin Dashboard</title>" ]; then
            echo "ERROR: Wrong title in build output: $TITLE"
            exit 1
          fi
          echo "Title verification passed."

      - name: Bundle server for deployment
        run: |
          mkdir -p deploy-package
          cp -r dist deploy-package/
          cp package.json pnpm-lock.yaml deploy-package/
          cp -r server deploy-package/
          cp -r shared deploy-package/
          cp start.sh deploy-package/
          chmod +x deploy-package/start.sh
          tar -czf dashboard-deploy.tar.gz -C deploy-package .

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload to server
        run: |
          scp -i ~/.ssh/deploy_key dashboard-deploy.tar.gz root@${{ secrets.DEPLOY_HOST }}:/tmp/dashboard-deploy.tar.gz

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            echo "=== Extracting new build ==="
            mkdir -p /var/www/mottainai-dashboard-new
            tar -xzf /tmp/dashboard-deploy.tar.gz -C /var/www/mottainai-dashboard-new

            echo "=== Installing production dependencies ==="
            cd /var/www/mottainai-dashboard-new
            npm install --production --legacy-peer-deps 2>&1 | tail -10
            echo "npm install exit code: $?"

            echo "=== Swapping deployment ==="
            # Backup current deployment
            if [ -d /var/www/mottainai-dashboard ]; then
              rm -rf /var/www/mottainai-dashboard-backup
              cp -r /var/www/mottainai-dashboard /var/www/mottainai-dashboard-backup
            fi

            # Copy env file if it exists (|| true prevents abort if dest dir is missing)
            if [ -f /var/www/mottainai-dashboard/.env ]; then
              cp /var/www/mottainai-dashboard/.env /var/www/mottainai-dashboard-new/.env || true
            fi

            # Swap — rsync WITHOUT --delete to preserve server-side files
            # (start.sh, .env, uploads, etc.) that are not in the build tarball.
            # Rule: never use rsync --delete when deploying to the live directory.
            rsync -a /var/www/mottainai-dashboard-new/ /var/www/mottainai-dashboard/

            echo "=== Restarting PM2 process ==="
            pm2 restart mottainai-dashboard --update-env
            pm2 save

            echo "=== Waiting for server to stabilize ==="
            sleep 8

            echo "=== PM2 process status ==="
            pm2 show mottainai-dashboard | grep -E "status|uptime|restart"

            echo "=== Recent PM2 logs (last 30 lines) ==="
            pm2 logs mottainai-dashboard --lines 30 --nostream 2>&1 || true

            echo "=== Health check (port from .env or 3003) ==="
            SERVER_PORT=$(grep -oP 'PORT=\K[0-9]+' /var/www/mottainai-dashboard/.env 2>/dev/null || echo "3003")
            echo "Checking port: $SERVER_PORT"
            curl -s http://localhost:${SERVER_PORT}/api/trpc/companies.list > /dev/null && echo "Health check: OK" || echo "Health check: FAILED (port $SERVER_PORT)"
            # Also try common ports
            for port in 3003 4000 3000 3004; do
              result=$(curl -s --max-time 2 http://localhost:${port}/api/trpc/companies.list 2>&1)
              if echo "$result" | grep -q "json\|data\|\[{"; then
                echo "Server responding on port $port"
                break
              fi
            done

            echo "=== Cleanup ==="
            rm -rf /var/www/mottainai-dashboard-new /tmp/dashboard-deploy.tar.gz
            echo "=== Verifying deployed title ==="
            DEPLOYED_TITLE=$(grep -o '<title>[^<]*</title>' /var/www/mottainai-dashboard/dist/public/index.html 2>/dev/null | head -1)
            echo "Deployed title: $DEPLOYED_TITLE"
            if [ "$DEPLOYED_TITLE" != "<title>Mottainai Admin Dashboard</title>" ]; then
              echo "WARNING: Deployed title mismatch: $DEPLOYED_TITLE"
            else
              echo "Title verification passed: $DEPLOYED_TITLE"
            fi
            echo "Deploy complete!"
          ENDSSH
