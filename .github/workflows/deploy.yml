name: Deploy Admin Dashboard

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Current protected main commit SHA approved for this production release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mottainai-admin-dashboard-production
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Verify Manual Release Request
    runs-on: ubuntu-latest

    steps:
      - name: Require a current protected main revision
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          SELECTED_REF: ${{ github.ref }}
          SELECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          test "$SELECTED_REF" = "refs/heads/main"
          test "$RELEASE_SHA" = "$SELECTED_SHA"
          CURRENT_MAIN_SHA=$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | cut -f1)
          test -n "$CURRENT_MAIN_SHA"
          test "$RELEASE_SHA" = "$CURRENT_MAIN_SHA"

  deploy:
    name: Build & Deploy to Production
    needs: release-preflight
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean previous build artifacts
        run: rm -rf dist/

      - name: Build frontend
        env:
          VITE_APP_TITLE: "Mottainai Admin Dashboard"
          VITE_APP_LOGO: "/favicon.ico"
          VITE_ANALYTICS_ENDPOINT: ""
          VITE_ANALYTICS_WEBSITE_ID: ""
          VITE_ARCGIS_BROWSER_KEY: ${{ secrets.VITE_ARCGIS_BROWSER_KEY }}
          VITE_ARCGIS_CUSTOMER_VIEW_URL: ${{ secrets.VITE_ARCGIS_CUSTOMER_VIEW_URL }}
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY }}
        run: pnpm build

      - name: Create release provenance manifest
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: node scripts/write-release-manifest.mjs

      - name: Verify build title
        run: |
          TITLE=$(grep -o '<title>[^<]*</title>' dist/public/index.html | head -1)
          echo "Built title: $TITLE"
          if [ "$TITLE" != "<title>Mottainai Admin Dashboard</title>" ]; then
            echo "ERROR: Wrong title in build output: $TITLE"
            exit 1
          fi
          echo "Title verification passed."

      - name: Bundle server for deployment
        run: |
          mkdir -p deploy-package
          cp -r dist deploy-package/
          cp package.json pnpm-lock.yaml deploy-package/
          cp -r server deploy-package/
          cp -r shared deploy-package/
          cp start.sh deploy-package/
          chmod +x deploy-package/start.sh
          tar -czf dashboard-deploy.tar.gz -C deploy-package .

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload to server
        run: |
          scp -i ~/.ssh/deploy_key dashboard-deploy.tar.gz root@${{ secrets.DEPLOY_HOST }}:/tmp/dashboard-deploy.tar.gz

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            echo "=== Extracting new build ==="
            mkdir -p /var/www/mottainai-dashboard-new
            tar -xzf /tmp/dashboard-deploy.tar.gz -C /var/www/mottainai-dashboard-new

            echo "=== Installing production dependencies ==="
            cd /var/www/mottainai-dashboard-new
            npm install --production --legacy-peer-deps 2>&1 | tail -10
            echo "npm install exit code: $?"

            echo "=== Swapping deployment ==="
            # Backup current deployment
            if [ -d /var/www/mottainai-dashboard ]; then
              rm -rf /var/www/mottainai-dashboard-backup
              cp -r /var/www/mottainai-dashboard /var/www/mottainai-dashboard-backup
            fi

            # Copy env file if it exists (|| true prevents abort if dest dir is missing)
            if [ -f /var/www/mottainai-dashboard/.env ]; then
              cp /var/www/mottainai-dashboard/.env /var/www/mottainai-dashboard-new/.env || true
            fi

            # Swap — rsync WITHOUT --delete to preserve server-side files
            # (start.sh, .env, uploads, etc.) that are not in the build tarball.
            # Rule: never use rsync --delete when deploying to the live directory.
            # Use --checksum so files with same name+size but different content are overwritten.
            rsync -a --checksum /var/www/mottainai-dashboard-new/ /var/www/mottainai-dashboard/

            echo "=== Verifying deployed static asset provenance ==="
            EXPECTED_RELEASE_SHA="${{ inputs.release_sha }}"
            RELEASE_MANIFEST=/var/www/mottainai-dashboard/dist/public/release-manifest.json
            node - "$RELEASE_MANIFEST" "$EXPECTED_RELEASE_SHA" <<'NODE'
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const { dirname, resolve, sep } = require("node:path");

            const [manifestPath, expectedReleaseSha] = process.argv.slice(2);
            const publicDir = dirname(manifestPath);
            const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
            if (manifest.releaseSha !== expectedReleaseSha) {
              throw new Error("Deployed manifest release revision does not match the approved release");
            }
            if (!Array.isArray(manifest.assets) || manifest.assets.length === 0) {
              throw new Error("Deployed manifest contains no static assets");
            }
            for (const asset of manifest.assets) {
              if (!asset || typeof asset.path !== "string" || typeof asset.sha256 !== "string") {
                throw new Error("Deployed manifest contains an invalid asset entry");
              }
              const assetPath = resolve(publicDir, asset.path);
              if (!assetPath.startsWith(`${publicDir}${sep}`) || !asset.path.startsWith("assets/")) {
                throw new Error("Deployed manifest asset path is unsafe");
              }
              const actualHash = createHash("sha256").update(readFileSync(assetPath)).digest("hex");
              if (actualHash !== asset.sha256) {
                throw new Error("Deployed static asset hash does not match the release manifest");
              }
            }
            console.log("Deployed static asset provenance verified.");
            NODE

            echo "=== Restarting PM2 process ==="
            pm2 restart mottainai-dashboard --update-env
            pm2 save

            echo "=== Waiting for server to stabilize ==="
            sleep 8

            echo "=== PM2 process status ==="
            pm2 show mottainai-dashboard | grep -E "status|uptime|restart"

            echo "=== Recent PM2 logs (last 30 lines) ==="
            pm2 logs mottainai-dashboard --lines 30 --nostream 2>&1 || true

            echo "=== Health check (port from .env or 3003) ==="
            SERVER_PORT=$(grep -oP 'PORT=\K[0-9]+' /var/www/mottainai-dashboard/.env 2>/dev/null || echo "3003")
            echo "Checking port: $SERVER_PORT"
            curl -s http://localhost:${SERVER_PORT}/api/trpc/companies.list > /dev/null && echo "Health check: OK" || echo "Health check: FAILED (port $SERVER_PORT)"
            # Also try common ports
            for port in 3003 4000 3000 3004; do
              result=$(curl -s --max-time 2 http://localhost:${port}/api/trpc/companies.list 2>&1)
              if echo "$result" | grep -q "json\|data\|\[{"; then
                echo "Server responding on port $port"
                break
              fi
            done

            echo "=== Verifying running server release revision ==="
            curl -fsS --retry 3 --retry-all-errors --max-time 15 \
              "http://localhost:${SERVER_PORT}/release-manifest.json?release_sha=${EXPECTED_RELEASE_SHA}" \
              | node -e 'let body=""; process.stdin.setEncoding("utf8"); process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => { const manifest = JSON.parse(body); if (manifest.releaseSha !== process.argv[1]) { throw new Error("Running server revision does not match approved release"); } console.log("Running server release revision verified."); });' "$EXPECTED_RELEASE_SHA"

            echo "=== Cleanup ==="
            rm -rf /var/www/mottainai-dashboard-new /tmp/dashboard-deploy.tar.gz
            echo "=== Verifying deployed title ==="
            DEPLOYED_TITLE=$(grep -o '<title>[^<]*</title>' /var/www/mottainai-dashboard/dist/public/index.html 2>/dev/null | head -1)
            echo "Deployed title: $DEPLOYED_TITLE"
            if [ "$DEPLOYED_TITLE" != "<title>Mottainai Admin Dashboard</title>" ]; then
              echo "WARNING: Deployed title mismatch: $DEPLOYED_TITLE"
            else
              echo "Title verification passed: $DEPLOYED_TITLE"
            fi

            echo "=== Verifying public release revision ==="
            curl -fsS --retry 3 --retry-all-errors --max-time 30 \
              "https://admin.kowope.xyz/release-manifest.json?release_sha=${EXPECTED_RELEASE_SHA}" \
              | node -e 'let body=""; process.stdin.setEncoding("utf8"); process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => { const manifest = JSON.parse(body); if (manifest.releaseSha !== process.argv[1]) { throw new Error("Public release revision does not match approved release"); } console.log("Public release revision verified."); });' "$EXPECTED_RELEASE_SHA"
            echo "Deploy complete!"
          ENDSSH
